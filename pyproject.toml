[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacelora"
version = "0.1.0"
description = "Reference implementation of exported-vector-targeted SurfaceLoRA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SurfaceLoRA Authors"}]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.optional-dependencies]
llm = [
  "accelerate>=0.30",
  "peft>=0.11",
  "transformers>=4.43",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
